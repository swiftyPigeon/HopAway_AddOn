<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- HopAway minimap icon: Murloc-ish frog face on a dark disc (crest, cheek
       fins, toothy mouth). The light outline is drawn as a wider stroke under
       the shapes, so only the outer edge shows. -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#24405a"/>
      <stop offset="1" stop-color="#0a121c"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe878"/>
      <stop offset="1" stop-color="#2a9455"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#disc)"/>
  <g stroke="#f2ffe0" stroke-width="3.4" fill="#f2ffe0" stroke-linejoin="round">
    <path d="M19 21 L21 5 L26.5 13 L32 1 L37.5 13 L43 5 L45 21 Z"/>
    <path d="M14 30 L2.5 25 L6 34 L2.5 42 L13 46 Z"/>
    <path d="M50 30 L61.5 25 L58 34 L61.5 42 L51 46 Z"/>
    <g transform="translate(32 37) scale(0.86) translate(-32 -37)">
      <circle cx="19" cy="24" r="10"/>
      <circle cx="45" cy="24" r="10"/>
      <ellipse cx="32" cy="38" rx="24" ry="15"/>
    </g>
  </g>
  <path d="M19 21 L21 5 L26.5 13 L32 1 L37.5 13 L43 5 L45 21 Z" fill="#f29a3e"/>
  <path d="M14 30 L2.5 25 L6 34 L2.5 42 L13 46 Z" fill="#f29a3e"/>
  <path d="M50 30 L61.5 25 L58 34 L61.5 42 L51 46 Z" fill="#f29a3e"/>
  <g transform="translate(32 37) scale(0.86) translate(-32 -37)">
  <g fill="url(#skin)">
    <circle cx="19" cy="24" r="10"/>
    <circle cx="45" cy="24" r="10"/>
    <ellipse cx="32" cy="38" rx="24" ry="15"/>
  </g>
  <circle cx="19" cy="23" r="6.6" fill="#ffffff"/>
  <circle cx="45" cy="23" r="6.6" fill="#ffffff"/>
  <ellipse cx="20" cy="23.5" rx="4" ry="3" fill="#101010"/>
  <ellipse cx="44" cy="23.5" rx="4" ry="3" fill="#101010"/>
  <circle cx="17.6" cy="20.6" r="1.4" fill="#ffffff"/>
  <circle cx="42.6" cy="20.6" r="1.4" fill="#ffffff"/>
  <circle cx="29" cy="33" r="1.1" fill="#1a5a33"/>
  <circle cx="35" cy="33" r="1.1" fill="#1a5a33"/>
  <!-- open mouth with teeth along the top -->
  <path d="M14 38 Q32 58 50 38 Q32 45 14 38 Z" fill="#5e1b22" stroke="#1a5a33" stroke-width="2.2"
        stroke-linejoin="round"/>
  <g fill="#ffffff">
    <path d="M19 40 L21.5 45.5 L24 41.4 Z"/>
    <path d="M26 42 L28.5 47.5 L31 42.9 Z"/>
    <path d="M33 42.9 L35.5 47.5 L38 42 Z"/>
    <path d="M40 41.4 L42.5 45.5 L45 40 Z"/>
  </g>
  </g>
</svg>
