<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- HopAway project image: a Murloc-ish frog, in profile, leaping from one lily pad
       (layer) to another, at night on a pond. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d33"/>
      <stop offset="0.5" stop-color="#16324a"/>
      <stop offset="1" stop-color="#0c3b3c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4f5c"/>
      <stop offset="1" stop-color="#0b2e33"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8d6"/>
      <stop offset="0.55" stop-color="#fff1b0"/>
      <stop offset="1" stop-color="#fff1b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe878"/>
      <stop offset="1" stop-color="#2a9455"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cbf47"/>
      <stop offset="1" stop-color="#2d7a2a"/>
    </linearGradient>
    <!-- One lily pad: a circle with a notch, squashed for perspective. -->
    <g id="lily">
      <path d="M0 0 L60 -12 A61.2 61.2 0 1 1 52 -32 Z" fill="url(#pad)" stroke="#1f5a1f" stroke-width="3"/>
      <g stroke="#2a6e28" stroke-width="2" opacity="0.8">
        <line x1="0" y1="0" x2="-55" y2="-25"/>
        <line x1="0" y1="0" x2="-50" y2="35"/>
        <line x1="0" y1="0" x2="10" y2="58"/>
        <line x1="0" y1="0" x2="45" y2="40"/>
        <line x1="0" y1="0" x2="-15" y2="-58"/>
      </g>
    </g>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="320" cy="78" r="34" fill="url(#moon)"/>
  <g fill="#ffffff">
    <circle cx="60" cy="50" r="1.6"/><circle cx="120" cy="90" r="1.2"/>
    <circle cx="200" cy="40" r="1.5"/><circle cx="250" cy="110" r="1.1"/>
    <circle cx="370" cy="150" r="1.3"/><circle cx="35" cy="140" r="1.1"/>
    <circle cx="160" cy="25" r="1"/><circle cx="280" cy="30" r="1.2"/>
  </g>

  <rect y="215" width="400" height="185" fill="url(#water)"/>
  <g fill="none" stroke="#9fe0e6" stroke-opacity="0.18" stroke-width="2">
    <ellipse cx="200" cy="360" rx="170" ry="18"/>
    <ellipse cx="60" cy="250" rx="45" ry="6"/>
    <ellipse cx="350" cy="240" rx="40" ry="5"/>
  </g>

  <!-- Pads: far, left (start), right (destination). -->
  <use href="#lily" transform="translate(228 232) scale(0.45 0.18)" opacity="0.7"/>
  <use href="#lily" transform="translate(100 318) scale(1.05 0.42)"/>
  <use href="#lily" transform="translate(302 310) scale(1.1 0.44) rotate(160)"/>

  <!-- Lotus on the destination pad -->
  <g transform="translate(330 296)">
    <ellipse cx="-9" cy="-4" rx="6" ry="11" transform="rotate(-30)" fill="#f7a8c8"/>
    <ellipse cx="9" cy="-4" rx="6" ry="11" transform="rotate(30)" fill="#f7a8c8"/>
    <ellipse cx="0" cy="-8" rx="6" ry="12" fill="#fbc3da"/>
    <circle cx="0" cy="-2" r="3" fill="#ffe27a"/>
  </g>

  <!-- Splash where the frog took off -->
  <g fill="none" stroke="#c8f4f6" stroke-opacity="0.55" stroke-width="2.5">
    <ellipse cx="112" cy="306" rx="26" ry="7"/>
    <ellipse cx="112" cy="306" rx="42" ry="12" stroke-opacity="0.3"/>
  </g>

  <!-- Leap arc -->
  <path d="M112 298 Q205 105 300 292" fill="none" stroke="#f2ffe0" stroke-opacity="0.65"
        stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/>

  <!-- The frog in profile, mid-leap from the left pad to the right one.
       Each part is drawn twice: a wider light pass first (the outline),
       then the colour on top, so only the outer edge of the outline shows. -->
  <g transform="translate(176 186) rotate(-7) scale(0.95)" stroke-linecap="round" stroke-linejoin="round">
    <!-- far legs (behind the body), darker -->
    <g fill="none" stroke="#f2ffe0">
      <path d="M30 -6 L-18 10 L-62 18" stroke-width="15"/>
      <path d="M-62 18 L-94 22" stroke-width="10"/>
      <path d="M108 6 L134 22 L146 32" stroke-width="10"/>
    </g>
    <g fill="none" stroke="#257a45">
      <path d="M30 -6 L-18 10 L-62 18" stroke-width="11.6"/>
      <path d="M-62 18 L-94 22" stroke-width="6.6"/>
      <path d="M108 6 L134 22 L146 32" stroke-width="6.6"/>
    </g>
    <!-- Murloc-style spiky fin along the head and back -->
    <path d="M94 -36 L88 -64 L78 -40 L68 -60 L61 -36 L50 -54 L46 -33 L34 -46 L32 -26 Z"
          fill="#f2ffe0" stroke="#f2ffe0" stroke-width="3.4"/>
    <path d="M94 -36 L88 -64 L78 -40 L68 -60 L61 -36 L50 -54 L46 -33 L34 -46 L32 -26 Z" fill="#f29a3e"/>
    <g stroke="#c4621f" stroke-width="1.6" fill="none">
      <path d="M86 -36 L87 -58 M70 -34 L68 -54 M52 -31 L50 -48 M38 -28 L35 -41"/>
    </g>
    <!-- body, head and eye bump: outline pass -->
    <g fill="#f2ffe0" stroke="#f2ffe0" stroke-width="3.4">
      <path d="M8 0 C8 -28 60 -38 100 -30 C120 -26 134 -14 136 -2 C134 8 118 14 100 14 C70 20 30 22 8 0 Z"/>
      <circle cx="98" cy="-30" r="13"/>
    </g>
    <!-- near back leg: thigh, shin, long foot with webbed toes -->
    <g fill="none" stroke="#f2ffe0">
      <path d="M24 4 L-28 22" stroke-width="21"/>
      <path d="M-28 22 L-72 32" stroke-width="15"/>
      <path d="M-72 32 L-106 36" stroke-width="11"/>
      <path d="M-106 36 L-118 30 M-106 36 L-120 38 M-106 36 L-116 46" stroke-width="7"/>
    </g>
    <g fill="none" stroke="#3aa45e">
      <path d="M24 4 L-28 22" stroke-width="17.6"/>
      <path d="M-28 22 L-72 32" stroke-width="11.6"/>
      <path d="M-72 32 L-106 36" stroke-width="7.6"/>
      <path d="M-106 36 L-118 30 M-106 36 L-120 38 M-106 36 L-116 46" stroke-width="3.6"/>
    </g>
    <!-- body and head colour -->
    <path d="M8 0 C8 -28 60 -38 100 -30 C120 -26 134 -14 136 -2 C134 8 118 14 100 14 C70 20 30 22 8 0 Z" fill="url(#skin)"/>
    <path d="M28 10 C60 20 95 17 114 9 C92 4 52 4 28 10 Z" fill="#dff5a8"/>
    <g fill="#1f7a45" opacity="0.5">
      <ellipse cx="44" cy="-14" rx="6" ry="4"/>
      <ellipse cx="66" cy="-22" rx="5" ry="3.5"/>
      <ellipse cx="30" cy="-4" rx="4" ry="3"/>
    </g>
    <circle cx="98" cy="-30" r="13" fill="#7ad86e"/>
    <circle cx="99" cy="-31" r="9.5" fill="#ffffff"/>
    <ellipse cx="102.5" cy="-31" rx="5.4" ry="4.2" fill="#101010"/>
    <circle cx="97" cy="-35" r="2.2" fill="#ffffff"/>
    <circle cx="127" cy="-15" r="1.6" fill="#1f5514"/>
    <path d="M90 -12 L70 -24 L74 -12 L62 -10 L74 -3 L66 6 L90 2 Z"
          fill="#f29a3e" stroke="#f2ffe0" stroke-width="2.4"/>
    <path d="M88 -10 L74 -18 M86 -5 L68 -7 M88 0 L72 4" stroke="#c4621f" stroke-width="1.4" fill="none"/>
    <path d="M136 -3 L94 1 Q112 22 134 8 Z" fill="#5e1b22" stroke="#1f5514" stroke-width="2.2"/>
    <path d="M104 0.3 L107 7 L110 -0.2 Z M113 -0.5 L116 6.5 L119 -1 Z M122 -1.3 L125 5.5 L128 -1.8 Z"
          fill="#ffffff"/>
    <path d="M110 15 L112 10 L115 15 Z M120 13.5 L122.5 9 L125 13 Z" fill="#ffffff"/>
    <!-- Sword in the right (near) hand, blade forward and up. Drawn before
         the arm so the fingers wrap the grip. -->
    <g transform="translate(138 40) rotate(-52) scale(1.3)">
      <g fill="#f2ffe0" stroke="#f2ffe0" stroke-width="3.4" stroke-linejoin="round">
        <circle cx="-10" cy="0" r="4"/>
        <rect x="-8" y="-2.6" width="16" height="5.2"/>
        <rect x="7" y="-11" width="5" height="22" rx="2"/>
        <path d="M12 -4.5 L80 -4.5 L92 0 L80 4.5 L12 4.5 Z"/>
      </g>
      <circle cx="-10" cy="0" r="4" fill="#e3b341"/>
      <rect x="-8" y="-2.6" width="16" height="5.2" fill="#6b3a1f"/>
      <rect x="7" y="-11" width="5" height="22" rx="2" fill="#e3b341"/>
      <path d="M12 -4.5 L80 -4.5 L92 0 L80 4.5 L12 4.5 Z" fill="#dde6ee"/>
      <path d="M12 0 L82 0 L92 0" stroke="#9aa8b4" stroke-width="1.6"/>
      <path d="M12 -4.5 L80 -4.5 L92 0" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    </g>
    <!-- near front leg, reaching for the landing pad -->
    <path d="M100 8 L124 28 L138 40" fill="none" stroke="#f2ffe0" stroke-width="11"/>
    <path d="M138 40 L150 38 M138 40 L148 46 M138 40 L140 50" fill="none" stroke="#f2ffe0" stroke-width="6.6"/>
    <path d="M100 8 L124 28 L138 40" fill="none" stroke="#3aa45e" stroke-width="7.6"/>
    <path d="M138 40 L150 38 M138 40 L148 46 M138 40 L140 50" fill="none" stroke="#3aa45e" stroke-width="3.2"/>
    <!-- drops falling from the back foot -->
    <g fill="#9fe0e6">
      <circle cx="-114" cy="56" r="3.4"/>
      <circle cx="-98" cy="66" r="2.6"/>
      <circle cx="-124" cy="72" r="2.2"/>
    </g>
  </g>
</svg>
